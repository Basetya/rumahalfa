<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard - SaaS Properti</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style> body { font-family: 'Inter', sans-serif; background-color: #f4f6f8; } </style>
</head>
<body class="p-4 sm:p-8 pb-36 antialiased">

  <div class="max-w-3xl mx-auto">
    <!-- HEADER -->
    <div class="bg-slate-900 text-white p-6 rounded-2xl shadow-lg mb-6 flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4">
      <div>
        <h1 class="text-xl font-bold">⚙️ Dashboard Pengaturan Properti</h1>
        <p class="text-xs text-slate-400 mt-1">Ubah landing page, galeri foto, spesifikasi, & AI Chatbot</p>
      </div>
      <div class="flex gap-2 w-full sm:w-auto">
        <button type="button" onclick="undoConfig()" class="bg-amber-500 hover:bg-amber-600 text-slate-900 font-bold px-4 py-2 rounded-xl text-xs shadow-md transition-all flex items-center gap-1.5 w-full sm:w-auto justify-center">
          <span>↩️ UNDO VERSI SEBELUMNYA</span>
        </button>
      </div>
    </div>

    <form id="admin-form" class="space-y-6">

      <!-- INFORMASI UTAMA -->
      <div class="bg-white p-5 sm:p-7 rounded-2xl shadow-sm border border-slate-200 space-y-4">
        <h2 class="text-base font-bold text-slate-800 border-b pb-3 flex items-center gap-2"><span>🏡</span> Informasi Utama Properti</h2>
        <div>
          <label for="cfg-title" class="block text-xs font-bold text-slate-600 uppercase mb-1">Judul Properti</label>
          <input type="text" id="cfg-title" class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl text-sm font-medium outline-none">
        </div>
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
          <div>
            <label for="cfg-price" class="block text-xs font-bold text-slate-600 uppercase mb-1">Harga Penawaran</label>
            <input type="text" id="cfg-price" class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl text-sm font-medium outline-none">
          </div>
          <div>
            <label for="cfg-whatsappNumber" class="block text-xs font-bold text-slate-600 uppercase mb-1">Nomor WhatsApp Owner</label>
            <input type="text" id="cfg-whatsappNumber" class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl text-sm font-medium outline-none">
          </div>
        </div>
        <div>
          <label for="cfg-address" class="block text-xs font-bold text-slate-600 uppercase mb-1">Alamat Lengkap</label>
          <input type="text" id="cfg-address" class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl text-sm font-medium outline-none">
        </div>
        <div>
          <label for="cfg-headline" class="block text-xs font-bold text-slate-600 uppercase mb-1">Headline Utama</label>
          <textarea id="cfg-headline" rows="2" class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl text-sm font-medium outline-none"></textarea>
        </div>
        <div>
          <label for="cfg-story" class="block text-xs font-bold text-slate-600 uppercase mb-1">Cerita Deskripsi (The Story)</label>
          <textarea id="cfg-story" rows="4" class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl text-sm font-medium outline-none"></textarea>
        </div>
      </div>

      <!-- VIDEO TOUR -->
      <div class="bg-white p-5 sm:p-7 rounded-2xl shadow-sm border border-slate-200 space-y-4">
        <h2 class="text-base font-bold text-slate-800 border-b pb-3 flex items-center gap-2"><span>🎬</span> Video Tour & Maps</h2>
        <div>
          <label for="cfg-videoUrl" class="block text-xs font-bold text-slate-600 uppercase mb-1">Link Embed YouTube Main Video</label>
          <input type="text" id="cfg-videoUrl" class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl text-sm outline-none">
        </div>
        <div>
          <label for="cfg-timelapseUrl" class="block text-xs font-bold text-slate-600 uppercase mb-1">Link Embed YouTube Shorts / Timelapse</label>
          <input type="text" id="cfg-timelapseUrl" class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl text-sm outline-none">
        </div>
      </div>

      <!-- DAFTAR FOTO GALERI (INPUT STANDAR BERSIH) -->
      <div class="bg-white p-5 sm:p-7 rounded-2xl shadow-sm border border-slate-200 space-y-4">
        <div class="flex justify-between items-center border-b pb-3">
          <h2 class="text-base font-bold text-slate-800">📸 Galeri Foto Properti</h2>
          <button type="button" onclick="addGalleryRow()" class="bg-slate-700 hover:bg-slate-800 text-white font-bold text-xs px-3.5 py-2 rounded-xl shadow-md transition-all">
            + Tambah Link Foto
          </button>
        </div>
        <div id="gallery-dynamic-list" class="space-y-3 pt-2"></div>
      </div>

      <!-- CHATBOT AI -->
      <div class="bg-white p-5 sm:p-7 rounded-2xl shadow-sm border border-slate-200 space-y-4">
        <h2 class="text-base font-bold text-slate-800 border-b pb-3 flex items-center gap-2"><span>🤖</span> Pengaturan Asisten AI (Chatbot)</h2>
        <div>
          <label for="cfg-bot_name" class="block text-xs font-bold text-slate-600 uppercase mb-1">Nama Bot</label>
          <input type="text" id="cfg-bot_name" class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl text-sm outline-none">
        </div>
      </div>

      <!-- SUBMIT BUTTON -->
      <div class="fixed bottom-0 left-0 right-0 p-4 bg-white/90 backdrop-blur-md border-t border-slate-200 z-50">
        <div class="max-w-3xl mx-auto">
          <button type="submit" id="btn-save" class="w-full bg-amber-500 hover:bg-amber-600 text-slate-900 font-bold py-4 rounded-xl shadow-xl transition-all uppercase tracking-wider text-sm">
            💾 SIMPAN & TERBITKAN LANDING PAGE
          </button>
        </div>
      </div>

    </form>
  </div>

  <script>
    const GAS_WEBHOOK_URL = "https://script.google.com/macros/s/AKfycbzgCSqpj94vtO-hXratpAa6dIiDmtHBPeAAL3-jHER_rnl6hGMvrcYNFY7mKjUZ0ss4oA/exec";
    let galleryCounter = 0;

    function addGalleryRow(url = "", category = "Interior") {
      galleryCounter++;
      const container = document.getElementById('gallery-dynamic-list');
      const rowId = `gal-row-${galleryCounter}`;
      const rowHtml = `
        <div id="${rowId}" class="p-3 bg-slate-50 rounded-xl border border-slate-200 flex flex-col sm:flex-row gap-2 items-center">
          <div class="flex-1 w-full">
            <input type="text" class="gal-url-input w-full px-3 py-2 bg-white border border-slate-200 rounded-lg text-xs outline-none" placeholder="Link Google Drive / URL Foto..." value="${url}">
          </div>
          <div class="w-full sm:w-44">
            <select class="gal-cat-input w-full px-3 py-2 bg-white border border-slate-200 rounded-lg text-xs outline-none font-bold text-slate-700">
              <option value="Interior" ${category === "Interior" ? "selected" : ""}>Interior</option>
              <option value="Eksterior" ${category === "Eksterior" ? "selected" : ""}>Eksterior</option>
              <option value="Lingkungan" ${category === "Lingkungan" ? "selected" : ""}>Lingkungan</option>
            </select>
          </div>
          <button type="button" onclick="document.getElementById('${rowId}').remove()" class="text-red-500 hover:bg-red-50 px-3 py-2 rounded-lg text-xs font-bold">✕ Hapus</button>
        </div>
      `;
      container.insertAdjacentHTML('beforeend', rowHtml);
    }

    async function loadData() {
      try {
        const reqBody = { action: "getSaasConfig" };
        const res = await fetch(GAS_WEBHOOK_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
          body: new URLSearchParams({ request: JSON.stringify(reqBody) })
        });
        const data = await res.json();
        if (data && data.success && data.config) {
          const cfg = data.config;
          if (cfg.title) document.getElementById('cfg-title').value = cfg.title;
          if (cfg.price) document.getElementById('cfg-price').value = cfg.price;
          if (cfg.whatsappNumber) document.getElementById('cfg-whatsappNumber').value = cfg.whatsappNumber;
          if (cfg.address) document.getElementById('cfg-address').value = cfg.address;
          if (cfg.headline) document.getElementById('cfg-headline').value = cfg.headline;
          if (cfg.story) document.getElementById('cfg-story').value = cfg.story;
          if (cfg.videoUrl) document.getElementById('cfg-videoUrl').value = cfg.videoUrl;
          if (cfg.timelapseUrl) document.getElementById('cfg-timelapseUrl').value = cfg.timelapseUrl;
          if (cfg.bot_name) document.getElementById('cfg-bot_name').value = cfg.bot_name;

          document.getElementById('gallery-dynamic-list').innerHTML = "";
          if (cfg.gallery && cfg.gallery.length > 0) {
            cfg.gallery.forEach(item => {
              if (typeof item === 'object') addGalleryRow(item.url, item.category);
              else addGalleryRow(item, "Interior");
            });
          }
        }
      } catch (err) { console.log("Memakai data default."); }
    }

    document.addEventListener("DOMContentLoaded", loadData);

    document.getElementById('admin-form').addEventListener('submit', async function(e) {
      e.preventDefault();
      const btn = document.getElementById('btn-save');
      btn.disabled = true; btn.innerText = "⏳ MEMPROSES & MENYIMPAN...";

      const galleryList = [];
      document.querySelectorAll('#gallery-dynamic-list > div').forEach(row => {
        const urlInput = row.querySelector('.gal-url-input');
        const catInput = row.querySelector('.gal-cat-input');
        if (urlInput && urlInput.value.trim()) {
          galleryList.push({ url: urlInput.value.trim(), category: catInput ? catInput.value : "Interior" });
        }
      });

      const payload = {
        title: document.getElementById('cfg-title').value,
        price: document.getElementById('cfg-price').value,
        whatsappNumber: document.getElementById('cfg-whatsappNumber').value,
        address: document.getElementById('cfg-address').value,
        headline: document.getElementById('cfg-headline').value,
        story: document.getElementById('cfg-story').value,
        videoUrl: document.getElementById('cfg-videoUrl').value,
        timelapseUrl: document.getElementById('cfg-timelapseUrl').value,
        bot_name: document.getElementById('cfg-bot_name').value,
        gallery: galleryList
      };

      try {
        const reqBody = { action: "saveAdminConfig", payload: payload };
        const res = await fetch(GAS_WEBHOOK_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
          body: new URLSearchParams({ request: JSON.stringify(reqBody) })
        });
        const data = await res.json();
        if (data && data.success) alert("🎉 BERHASIL! Landing page ter-update!");
        else alert("Gagal menyimpan.");
      } catch (err) { alert("Kesalahan koneksi."); }
      finally { btn.disabled = false; btn.innerText = "💾 SIMPAN & TERBITKAN LANDING PAGE"; }
    });
  </script>
</body>
</html>
